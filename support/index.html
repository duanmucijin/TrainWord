<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技术支持 - TrainWord</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <!-- <link rel="stylesheet" href="support.css"> -->
    <style>:root {
    --brand-blue: #007AFF;
    --bg-white: #FFFFFF;
    --text-black: #3C3C3C;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "SF Pro Display", "PingFang SC", sans-serif;
    background: #F8FBFF;
    color: var(--text-black);
}

/* nav */
.navbar {
    padding: 25px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #F0F0F0;
    background: white;
}

.nav-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.nav-logo {
    height: 32px;
    border-radius: 8px;
}

.nav-btn-main {
    text-decoration: none;
    font-weight: 800;
    color: var(--brand-blue);
    font-size: 14px;
}

/* hero */
.support-hero {
    padding: 100px 20px 70px;
    text-align: center;
    background: radial-gradient(circle at top right, #F0F7FF 0%, #FFF 60%);
}

.support-badge {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 100px;
    background: #EAF4FF;
    color: var(--brand-blue);
    font-weight: 800;
    font-size: 12px;
    margin-bottom: 20px;
}

.support-hero h1 {
    font-size: 56px;
    margin-bottom: 18px;
}

.support-hero p {
    font-size: 18px;
    color: #667085;
}

/* content */
.support-content {
    max-width: 900px;
    margin: 0 auto;
    padding: 80px 20px;
}

.support-card {
    background: white;
    border-radius: 28px;
    padding: 35px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.06);
    margin-bottom: 28px;
}

.support-card h3 {
    font-size: 26px;
    margin-bottom: 20px;
}

.support-card a {
    color: var(--brand-blue);
    font-weight: 700;
    text-decoration: none;
}

.sub-text {
    margin-top: 10px;
    color: #8A8A8A;
    font-size: 14px;
}

.faq-item {
    padding: 18px 0;
    border-bottom: 1px solid #F0F0F0;
}

.faq-item:last-child {
    border-bottom: none;
}

.faq-item strong {
    display: block;
    margin-bottom: 8px;
}

/* footer */
.site-footer {
    margin-top: 100px;
    padding: 80px 40px 50px;
    background: #F7F9FC;
    border-top: 1px solid #EEF1F5;
    border-radius: 48px 48px 0 0;
}

.footer-inner {
    max-width: 1200px;
    margin: 0 auto;
}

.footer-brand {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 30px;
}

.footer-brand img {
    width: 44px;
    border-radius: 12px;
}

.footer-brand h3 {
    font-size: 18px;
    margin-bottom: 4px;
}

.footer-brand p {
    font-size: 14px;
    color: #8A8A8A;
}

.footer-links {
    display: flex;
    gap: 24px;
    margin-bottom: 30px;
}

.footer-links a {
    text-decoration: none;
    color: #5F6B7A;
    font-weight: 700;
}

.footer-links a:hover {
    color: var(--brand-blue);
}

.footer-bottom {
    padding-top: 20px;
    border-top: 1px solid #EAECEF;
    color: #98A2B3;
    font-size: 13px;
}</style>
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <img src="../assets/logo.png" class="nav-logo">
        <h2>TrainWord</h2>
    </div>

    <a href="/" class="nav-btn-main">返回首页</a>
</nav>

<header class="support-hero">
    <div class="hero-inner">
        <span class="support-badge">Support Center</span>
        <h1>技术支持</h1>
        <p>如遇到使用问题、功能建议或 Bug 反馈，可通过邮箱联系我们。</p>
    </div>
</header>

<section class="support-content">

    <div class="support-card">
        <h3>联系方式</h3>
        <p>邮箱支持：</p>
        <a href="mailto:duanmucijin@163.com">
            duanmucijin@163.com
        </a>
        <p class="sub-text">通常将在 1-3 个工作日内回复</p>
    </div>

    <div class="support-card">
        <h3>常见问题</h3>

        <div class="faq-item">
            <strong>无法进入应用怎么办？</strong>
            <p>请尝试更新至最新版本，或重新启动应用。</p>
        </div>

        <div class="faq-item">
            <strong>如何反馈 Bug 或建议？</strong>
            <p>请发送邮件并描述问题场景及设备信息。</p>
        </div>

        <div class="faq-item">
            <strong>学习数据会丢失吗？</strong>
            <p>请避免频繁卸载应用，并确保设备存储正常。</p>
        </div>
    </div>

</section>

<footer class="site-footer">
    <div class="footer-inner">

        <div class="footer-brand">
            <img src="../assets/logo.png" alt="logo">
            <div>
                <h3>TrainWord</h3>
                <p>每一站，皆进步。</p>
            </div>
        </div>

        <div class="footer-links">
            <a href="/">首页</a>
            <a href="mailto:duanmucijin@163.com">联系我们</a>
        </div>

        <div class="footer-bottom">
            © 2026 TrainWord
        </div>
    </div>
</footer>

</body>
</html>
